<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>
    <div>
        <form action="welcome.html" target="_blank">
            <Fieldset>
                <Legend>Enter a basic data</Legend>
            <label for="fullName">FullName :</label>
            <input type="text" id="fullName" placeholder="Enter your name" required>
            <br>
            <br>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <br>
            <br>
            <label for="possword">possword :</label>
            <input type="password" id="possword" placeholder="Enter your possword" required>

             <br>
            <br>
            <label for="checkbox">Rre you 18 + :</label>
            <input type="checkbox" id="checkbox" >
             <br>
            <br>
            <label for="phoneNumber">Mobile Number :</label>
            <input type="number" id="phoneNumber"  required   min="0" >
             <br>
            <br>
            <label for="male">Gender :</label>
            <label for="male">male :</label>
            <input type="radio" id="male" name="gender" required >
             <label for="female">female :</label>
            <input type="radio" id="female" name="gender" >
             <br>
            <br>
            <label for="date">Enter your DOB :</label>
            <input type="date" id="date" placeholder="Enter your DOB" required >
             <br>
            <br>
            <label for="file">Profile Photo :</label>
            <input type="file" id="file" required >
            <br>
            <br>
            <label for="city">Select your city :</label>
            <select name="city" id="city"> 
                <option value="delhi">Delhi</option>
                <option value="mumbai">Mumbai</option>
                <option value="noida">Noida</option>
                <option value="kolkata">Kolkata</option>
                <option value="jaipur">jaipur</option>
            </select>
             <button type="submit">Submit form</button>



</Fieldset>
        </form>
    </div>

</body>
</html>
